{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><h1>Edit Team</h1><p class="muted">Update organisational team details.</p></div></div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/teams/{{ team.id }}/edit" class="form-card">
<label>Team Name<input type="text" name="name" value="{{ team.name }}" required></label>
<label>Department<select name="department_id" required>{% for department in departments %}<option value="{{ department.id }}" {% if department.id == team.department_id %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></label>
<label>Description<textarea name="description" rows="4">{{ team.description or '' }}</textarea></label>
<label class="checkbox"><input type="checkbox" name="is_active" value="true" {% if team.is_active %}checked{% endif %}> Active</label>
<div class="action-bar"><button type="submit">Save Changes</button><a class="button secondary" href="/admin/teams/{{ team.id }}">Cancel</a></div>
</form>
{% endblock %}
