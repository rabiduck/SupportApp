{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><h1>Create Team</h1><p class="muted">Add a new organisational team.</p></div></div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/teams/create" class="form-card">
<label>Team Name<input type="text" name="name" value="{{ form.name if form else '' }}" required></label>
<label>Department<select name="department_id" required>{% for department in departments %}<option value="{{ department.id }}" {% if form and form.department_id == department.id %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></label>
<label>Description<textarea name="description" rows="4">{{ form.description if form else '' }}</textarea></label>
<div class="action-bar"><button type="submit">Create Team</button><a class="button secondary" href="/admin/teams">Cancel</a></div>
</form>
{% endblock %}
