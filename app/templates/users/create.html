{% extends "base.html" %}
{% block content %}<div class="page-header"><div><h1>Create User</h1><p class="muted">Create a portal account.</p></div></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/admin/users/create" class="form-card"><label>Username<input type="text" name="username" required></label><label>Display Name<input type="text" name="display_name" required></label><label>Email<input type="email" name="email"></label><label>Initial Password<input type="password" name="password" required></label><div class="action-bar"><button type="submit">Create User</button><a class="button secondary" href="/admin/users">Cancel</a></div></form>{% endblock %}
