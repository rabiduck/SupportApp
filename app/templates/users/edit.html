{% extends "base.html" %}
{% block content %}<div class="page-header"><div><h1>Edit User</h1><p class="muted">Update account details and roles.</p></div></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/admin/users/{{ target.id }}/edit" class="form-card"><label>Display Name<input type="text" name="display_name" value="{{ target.display_name }}" required></label><label>Email<input type="email" name="email" value="{{ target.email or '' }}"></label><fieldset><legend>Roles</legend>{% for role in roles %}<label class="checkbox"><input type="checkbox" name="role_ids" value="{{ role.id }}" {% if role in target.roles %}checked{% endif %}> {{ role.name }}</label>{% endfor %}</fieldset><label class="checkbox"><input type="checkbox" name="is_active" value="true" {% if target.is_active %}checked{% endif %}> Active</label><div class="action-bar"><button type="submit">Save Changes</button><a class="button secondary" href="/admin/users/{{ target.id }}">Cancel</a></div></form>{% endblock %}
