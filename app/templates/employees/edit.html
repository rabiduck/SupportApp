{% extends "base.html" %}
{% block content %}<div class="page-header"><div><h1>Edit Employee</h1><p class="muted">Update employee details.</p></div></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/admin/employees/{{ employee.id }}/edit" class="form-card"><label>Display Name<input type="text" name="display_name" value="{{ employee.display_name }}" required></label><label>User Account<select name="user_id"><option value="">No linked account</option>{% for item in users %}<option value="{{ item.id }}" {% if employee.user_id == item.id %}selected{% endif %}>{{ item.display_name }} ({{ item.username }})</option>{% endfor %}</select></label><label>Team<select name="team_id" required>{% for team in teams %}<option value="{{ team.id }}" {% if employee.team_id == team.id %}selected{% endif %}>{{ team.name }}</option>{% endfor %}</select></label><label>Job Title<input type="text" name="job_title" value="{{ employee.job_title or '' }}"></label><label>Phone<input type="text" name="phone" value="{{ employee.phone or '' }}"></label><label class="checkbox"><input type="checkbox" name="is_active" value="true" {% if employee.is_active %}checked{% endif %}> Active</label><div class="action-bar"><button type="submit">Save Changes</button><a class="button secondary" href="/admin/employees/{{ employee.id }}">Cancel</a></div></form>{% endblock %}
