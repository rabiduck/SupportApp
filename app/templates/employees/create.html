{% extends "base.html" %}
{% block content %}<div class="page-header"><div><h1>Create Employee</h1><p class="muted">Add an employee record.</p></div></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/admin/employees/create" class="form-card"><label>Display Name<input type="text" name="display_name" required></label><label>User Account<select name="user_id"><option value="">No linked account</option>{% for item in users %}<option value="{{ item.id }}">{{ item.display_name }} ({{ item.username }})</option>{% endfor %}</select></label><label>Team<select name="team_id" required>{% for team in teams %}<option value="{{ team.id }}">{{ team.name }}</option>{% endfor %}</select></label><label>Job Title<input type="text" name="job_title"></label><label>Phone<input type="text" name="phone"></label><div class="action-bar"><button type="submit">Create Employee</button><a class="button secondary" href="/admin/employees">Cancel</a></div></form>{% endblock %}
